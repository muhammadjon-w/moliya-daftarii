# Faqat PostgreSQL'ni lokal ishga tushirish uchun: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: moliya
      POSTGRES_USER: moliya
      POSTGRES_PASSWORD: moliya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
