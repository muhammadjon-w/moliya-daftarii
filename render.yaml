# Render Blueprint: Dashboard → New → Blueprint → shu repo.
databases:
  - name: moliya-db
    plan: free
    region: frankfurt
    databaseName: moliya
    user: moliya

services:
  # --- Backend: Django API ---
  - type: web
    name: moliya-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: moliya-backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "false"
      - key: DEV_AUTH_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: BOT_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: moliya-db
          property: connectionString
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: moliya-app
          property: host
      - key: BOT_USERNAME
        value: moliyadaftari_bot
      - key: BOT_TOKEN
        sync: false # Render so'raydi: @BotFather bergan token
      - key: TRIAL_DAYS
        value: "30"

  # --- Frontend: Vue mini app (statik) ---
  - type: web
    name: moliya-app
    runtime: static
    rootDir: moliya-frontend
    buildCommand: npm ci && VITE_API_BASE_URL="https://$API_HOST/api/v1" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_HOST
        fromService:
          type: web
          name: moliya-api
          property: host
      - key: VITE_BOT_USERNAME
        value: moliyadaftari_bot
